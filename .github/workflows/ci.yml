name: CI

# Quality gate for every pull request and every push to main.
# Also reusable via workflow_call so deploy.yml can require the same checks
# before anything reaches GitHub Pages.
#
# `npm run build` alone does not check types: Vite strips them with esbuild and
# never type-checks, so a reference to an undefined identifier builds and ships
# clean and only fails in the browser. `tsc --noEmit` is the step that catches it.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# Include event_name so a push-triggered run and deploy.yml's workflow_call
# (same ref, same workflow name) do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typecheck first: clearest signal for the largest class of breakage.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # husky + lint-staged format on commit, but only on the machine that ran
      # it — this covers commits made anywhere else.
      - name: Check formatting
        run: npm run format:check

      - name: Validate prompt gallery
        run: npm run gallery:validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Deploy workflow sets this for the Pages base path; CI builds with
          # the default `/` base so PRs exercise a plain production build.
          GITHUB_PAGES: 'false'

  # Sibling job: Chromium-only Playwright smoke (home, routes, demo, upload).
  # Kept separate so a slow browser install does not block the quality-gate
  # signal, and so quality-gate failures do not skip e2e entirely when both
  # are requested as checks.
  e2e-chromium:
    name: e2e-chromium
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npm run test:e2e
        env:
          CI: 'true'
          GITHUB_PAGES: 'false'
